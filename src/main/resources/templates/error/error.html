<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main}, ~{})}">
<head>
    <title>Có lỗi xảy ra · LibraryHub</title>
</head>
<body>
<main>
    <div class="card mx-auto" style="max-width: 640px">
        <div class="card-body text-center p-5">
            <div class="error-code mb-2" th:text="${status} ?: 'Lỗi'">404</div>
            <h4 class="mb-3" th:switch="${status}">
                <span th:case="404">Không tìm thấy dữ liệu</span>
                <span th:case="400">Yêu cầu không hợp lệ</span>
                <span th:case="*">Đã có lỗi xảy ra</span>
            </h4>
            <p class="text-body-secondary mb-4"
               th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : 'Trang bạn yêu cầu không tồn tại hoặc đã có lỗi xảy ra.'">
                Thông báo lỗi
            </p>
            <div class="d-flex gap-2 justify-content-center">
                <a href="javascript:history.back()" class="btn btn-light"><i class="bi bi-arrow-left me-1"></i>Quay lại</a>
                <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house me-1"></i>Về trang chủ</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
